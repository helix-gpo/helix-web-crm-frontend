@if (isPublicPage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/images/logo-no-bg.svg" alt="Helix GPO" class="sidebar-logo" />
        <span class="sidebar-title">CRM</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/dashboard">
          <span class="material-symbols-rounded">dashboard</span>
          <span>Dashboard</span>
          <span class="soon-badge">bald</span>
        </a>
        <a class="nav-item" routerLink="/tenants" routerLinkActive="active">
          <span class="material-symbols-rounded">apartment</span>
          <span>Mandanten</span>
        </a>
        <a class="nav-item" routerLink="/projects" routerLinkActive="active">
          <span class="material-symbols-rounded">work</span>
          <span>Projekte</span>
        </a>
        <a class="nav-item" routerLink="/invoices" routerLinkActive="active">
          <span class="material-symbols-rounded">receipt_long</span>
          <span>Rechnungen</span>
        </a>
        <a class="nav-item" routerLink="/testimonials" routerLinkActive="active">
          <span class="material-symbols-rounded">rate_review</span>
          <span>Referenzen</span>
        </a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-search">
          <span class="material-symbols-rounded">search</span>
          <input type="text" placeholder="Suchen..." />
        </div>

        <div class="topbar-user">
          <app-avatar [name]="auth.userName() ?? '?'" [size]="'3.6rem'"></app-avatar>
          <span class="user-name">{{ auth.userName() ?? 'Wird geladen...' }}</span>
          <button class="logout-button" (click)="auth.logout()">
            <span class="material-symbols-rounded">logout</span>
          </button>
        </div>
      </header>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
