<div class="session-page">
  <div class="session-blob session-blob--cyan"></div>
  <div class="session-blob session-blob--pink"></div>

  <div class="session-card">
    <div class="session-icon-wrapper">
      <span class="material-symbols-rounded">schedule</span>
    </div>

    <p class="session-eyebrow">Internes CRM</p>
    <h1 class="session-title">Deine Sitzung ist abgelaufen</h1>
    <p class="session-subtitle">
      Aus Sicherheitsgründen wurdest du nach längerer Inaktivität automatisch abgemeldet. Kehr zur
      Startseite zurück, um dich erneut anzumelden.
    </p>

    <button class="session-button" (click)="backToStart()">
      <span class="material-symbols-rounded">arrow_back</span>
      <span>Zurück zur Startseite</span>
    </button>
  </div>
</div>
